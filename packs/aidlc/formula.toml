formula = "aidlc"
version = 1
title = "AI-DLC"

[[steps]]
id = "intent-capture"
phase = "ideation"
role = "aidlc-product-agent"
instructions = "steps/intent-capture.md"
goal = "Run the AI-DLC stage \"Intent Capture & Framing\" (ideation) at the run's depth. It produces: intent-statement, stakeholder-map, intent-capture-questions."
needs = []
gate = "human"
review = "aidlc-product-lead-agent"
max_attempts = 3
conditional = false
environment_change = false
docs_only = true
outputs = [ "intent-statement", "stakeholder-map", "intent-capture-questions" ]
inputs = []
verifiers = [ "claim-sources", "required-sections", "upstream-coverage" ]
context = []
support_roles = [ "aidlc-architect-agent" ]

[[steps]]
id = "market-research"
phase = "ideation"
role = "aidlc-product-agent"
instructions = "steps/market-research.md"
goal = "Run the AI-DLC stage \"market-research\" (ideation) at the run's depth. It produces: competitive-analysis, market-trends, build-vs-buy, market-research-questions. It runs only when it applies: Execute when initiative has external market positioning or build-vs-buy considerations. Skip for internal tools, bug fixes, or refactors. If it does not apply, submit \"skipped\" with the reason."
needs = [ "intent-capture" ]
gate = "human"
max_attempts = 3
conditional = true
environment_change = false
docs_only = true
outputs = [ "competitive-analysis", "market-trends", "build-vs-buy", "market-research-questions" ]
verifiers = [ "required-sections", "upstream-coverage" ]
context = []
support_roles = []

[[steps.inputs]]
from = "intent-capture"
name = "intent-statement"
required = true

[[steps]]
id = "feasibility"
phase = "ideation"
role = "aidlc-architect-agent"
instructions = "steps/feasibility.md"
goal = "Run the AI-DLC stage \"Feasibility & Constraints\" (ideation) at the run's depth. It produces: feasibility-assessment, constraint-register, raid-log, feasibility-questions. It runs only when it applies: Execute when there are integration constraints, regulatory requirements, or significant technical uncertainty. Skip for trivial changes with no technical risk. If it does not apply, submit \"skipped\" with the reason."
needs = [ "intent-capture", "market-research" ]
gate = "human"
max_attempts = 3
conditional = true
environment_change = false
docs_only = true
outputs = [ "feasibility-assessment", "constraint-register", "raid-log", "feasibility-questions" ]
verifiers = [ "required-sections", "upstream-coverage" ]
context = []
support_roles = [ "aidlc-aws-platform-agent", "aidlc-compliance-agent" ]

[[steps.inputs]]
from = "intent-capture"
name = "intent-statement"
required = true

[[steps.inputs]]
from = "market-research"
name = "competitive-analysis"
required = false

[[steps.inputs]]
from = "market-research"
name = "market-trends"
required = false

[[steps.inputs]]
from = "market-research"
name = "build-vs-buy"
required = false

