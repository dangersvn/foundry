goal = "Run the AI-DLC stage \"functional-design\" (construction) at the run's depth. It produces: entities, rules, functional-spec, traceability, frontend-components (optional). When the plan lists units, it runs once per unit-of-work and your unit is in the envelope; otherwise it runs once for the whole change. It runs only when it applies: New data models, complex business logic, or business rules need design. Skip if simple logic changes with no new business logic. If it does not apply, submit \"skipped\" with the reason."
