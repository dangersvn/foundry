[[steps]]
id = "reverse-engineering"
phase = "inception"
role = "aidlc-developer-agent"
instructions = "steps/reverse-engineering.md"
goal = "Run the AI-DLC stage \"reverse-engineering\" (inception) at the run's depth. It produces: business-overview, architecture, code-structure, api-documentation, component-inventory, technology-stack, dependencies, code-quality-assessment, reverse-engineering-timestamp. It runs only when it applies: Execute when project is brownfield. On rerun the Step 1 guard checks store freshness (codekb-scope-diff) - verified-CURRENT stores may be reused by human choice, anything else rescans. Skip for greenfield projects. If it does not apply, submit \"skipped\" with the reason."
needs = []
gate = "human"
max_attempts = 3
conditional = true
environment_change = false
docs_only = true
outputs = [ "business-overview", "architecture", "code-structure", "api-documentation", "component-inventory", "technology-stack", "dependencies", "code-quality-assessment", "reverse-engineering-timestamp" ]
inputs = []
verifiers = [ "required-sections", "upstream-coverage" ]
context = [ "knowledge/aidlc-developer-agent/code-analysis-guide.md", "knowledge/aidlc-developer-agent/re-artifacts.md" ]
support_roles = [ "aidlc-architect-agent" ]

[[steps]]
id = "practices-discovery"
phase = "inception"
role = "aidlc-pipeline-deploy-agent"
instructions = "steps/practices-discovery.md"
goal = "Run the AI-DLC stage \"practices-discovery\" (inception) at the run's depth. It produces: team-practices, discovered-rules, evidence, practices-discovery-timestamp. It runs only when it applies: Always rerun for freshness. Brownfield discovers from evidence + reverse-engineering artifacts. Greenfield prompts user via structured questions using org.md defaults. If it does not apply, submit \"skipped\" with the reason."
needs = [ "reverse-engineering" ]
gate = "human"
max_attempts = 3
conditional = true
environment_change = false
docs_only = true
outputs = [ "team-practices", "discovered-rules", "evidence", "practices-discovery-timestamp" ]
verifiers = [ "required-sections", "upstream-coverage" ]
context = []
support_roles = [ "aidlc-quality-agent", "aidlc-developer-agent", "aidlc-devsecops-agent" ]

[[steps.inputs]]
from = "reverse-engineering"
name = "code-structure"
required = false
