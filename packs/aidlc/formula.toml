goal = "Run the AI-DLC stage \"infrastructure-design\" (construction) at the run's depth. It produces: infrastructure-specification, monitoring-design, cicd-pipeline, traceability. When the plan lists units, it runs once per unit-of-work and your unit is in the envelope; otherwise it runs once for the whole change. It runs only when it applies: Infrastructure services need mapping, deployment architecture required, or cloud resources needed. Skip if no infrastructure changes and infrastructure already defined. If it does not apply, submit \"skipped\" with the reason."
