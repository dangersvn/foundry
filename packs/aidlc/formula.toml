goal = "Run the AI-DLC stage \"rough-mockups\" (ideation) at the run's depth. It produces: wireframes, user-flow, rough-mockups-questions. It runs only when it applies: Execute when user-facing UI is part of the initiative; for API/backend, produce system interaction diagrams. Skip for non-UI, API-only, or infrastructure-only initiatives. If it does not apply, submit \"skipped\" with the reason."
